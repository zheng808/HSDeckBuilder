name: Deploy to AWS
# After "Release image" publishes a new image, assume the OIDC deploy role created by
# infra/aws and ask SSM to run /opt/hsdeck/deploy.sh on the instance (tag App=<app_name>).
# Needs repository variables: AWS_DEPLOY_ROLE_ARN (from `tofu output`), optionally AWS_REGION.
# The role trusts GitHub's OIDC subject for this repo (both the classic and the owner@id/repo@id formats).
on:
  workflow_run:
    workflows: ['Release image']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    concurrency: aws-deploy
    steps:
      - name: Check the AWS_DEPLOY_ROLE_ARN variable
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "::notice title=AWS_DEPLOY_ROLE_ARN::'$ROLE' (length ${#ROLE})"
          case "$ROLE" in
            arn:aws:iam::[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]:role/*) echo "looks like a role ARN" ;;
            *) echo "::error::AWS_DEPLOY_ROLE_ARN must look like arn:aws:iam::<account-id>:role/<name> (get it from 'tofu output -raw github_deploy_role_arn' in infra/aws)"; exit 1 ;;
          esac
          # Report the OIDC token claims AWS will see (claims only, never the token).
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' | base64 -d 2>/dev/null | jq -c '{iss, aud, sub, repository, ref, event_name}')
          echo "::notice title=OIDC claims::$CLAIMS"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Run deploy.sh on the instance via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=${{ vars.AWS_APP_NAME || 'hsdeckbuilder' }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/infra/aws/deploy.sh -o /opt/hsdeck/deploy.sh","chmod +x /opt/hsdeck/deploy.sh","/opt/hsdeck/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" --details \
              --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                         --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text | tail -5; exit 0;;
              Failed|Cancelled|TimedOut) aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                         --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text | tail -40; exit 1;;
            esac
            sleep 10
          done
          echo "timed out waiting for the deploy command"; exit 1
